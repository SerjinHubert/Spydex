name: Build Unsigned iOS IPA

on: workflow_dispatch

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release via Shorebird
        run: |
          # We use --export-method=ad-hoc or simply let it build an xcarchive
          shorebird release ios --no-codesign
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y SpydexUnsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spydex-iOS-App
          path: SpydexUnsigned.ipa
